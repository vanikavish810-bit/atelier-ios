name: Build Atelier iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'www/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Add iOS platform
        run: npx cap add ios
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build unsigned iOS app
        run: |
          cd ios/App
          xcodebuild             -project App.xcodeproj             -scheme App             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Atelier.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Atelier-iOS
          path: Atelier.ipa
